<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina del orquestador</title>
<meta name="oficina-token" content="__OFICINA_TOKEN__">
<style>
  :root { --s: 2; --madera: #5a3a22; --crema: #fff3da; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #1d130e radial-gradient(ellipse at 50% 35%, #3b271b 0%, #1d130e 72%);
    color: #fbe9c8; font-family: "Lucida Console", Consolas, "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--s) * 3px);
  }
  #hud, #ticker { width: var(--ancho); }
  #hud {
    display: flex; align-items: center; gap: calc(var(--s) * 4px); flex-wrap: wrap;
    background: #4a2f1e; padding: calc(var(--s) * 3px) calc(var(--s) * 5px);
    box-shadow: 0 0 0 3px #2b1a10, 0 0 0 6px #8a5a3b, 6px 6px 0 6px rgba(0,0,0,.35);
    font-size: calc(var(--s) * 6px); text-shadow: 2px 2px 0 #2b1a10;
  }
  #hud h1 { margin: 0; font-size: calc(var(--s) * 7px); color: #ffd166; letter-spacing: 1px; white-space: nowrap; }
  #hud .chip {
    background: #2b1a10; padding: calc(var(--s) * 1.5px) calc(var(--s) * 4px); white-space: nowrap;
    box-shadow: inset 0 0 0 2px #6b4630;
  }
  #hud .chip b { color: #ffd166; }
  #hud .chip.grande b { font-size: 1.6em; color: #95d5b2; line-height: 1; vertical-align: -0.1em; }
  .contador { position: relative; }
  #hud button.chip { font: inherit; color: inherit; border: 0; cursor: pointer; text-shadow: inherit; }
  #hud button.chip:hover, .contador.abierto button.chip { background: #3a2418; box-shadow: inset 0 0 0 2px #d4a64a; }
  #hud button.chip i { font-style: normal; color: #ffd166; display: inline-block; margin-left: 2px; transition: transform .2s; }
  .contador.abierto button.chip i { transform: rotate(180deg); }
  .desplegable {
    display: none; position: absolute; top: calc(100% + 10px); left: 0; z-index: 20;
    width: calc(var(--s) * 200px); max-height: 60vh; overflow: auto;
    background: var(--crema); color: #3b2414; text-shadow: none; font-size: calc(var(--s) * 5px); line-height: 1.35;
    padding: calc(var(--s) * 3px) calc(var(--s) * 4px);
    box-shadow: 0 0 0 3px #5a3a22, 6px 6px 0 3px rgba(0,0,0,.35);
  }
  .contador.abierto .desplegable { display: block; }
  .desplegable h3 { margin: 0 0 calc(var(--s) * 2px); font-size: 1.05em; color: #6b4630; }
  .desplegable .cerrado { padding: calc(var(--s) * 1px) 0; border-bottom: 1px dashed #e0c9a0; }
  .desplegable .cerrado time { margin-left: auto; padding-left: 6px; color: #8a5a3b; flex: none; }
  .grandes { display: flex; justify-content: space-around; text-align: center; margin-top: calc(var(--s) * 2px); }
  .grandes b { display: block; font-size: 2.1em; line-height: 1.05; color: #2d6a4f; }
  .grandes div:last-child b { color: #b5473a; }
  #hud .der { margin-left: auto; display: flex; align-items: center; gap: calc(var(--s) * 3px); white-space: nowrap; }
  #vivo { width: calc(var(--s) * 4px); height: calc(var(--s) * 4px); background: #95d5b2; box-shadow: 0 0 0 2px #2b1a10; }
  #vivo.mal { background: #e63946; }
  #vivo.pulso { animation: pulso .6s steps(2) 2; }
  @keyframes pulso { 50% { background: #fff; } }

  #escena { position: relative; width: var(--ancho); height: var(--alto);
    box-shadow: 0 0 0 3px #2b1a10, 0 0 0 6px #8a5a3b, 8px 8px 0 6px rgba(0,0,0,.35); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  .cartel {
    position: absolute; top: calc(var(--s) * 12px);
    background: var(--crema); color: #3b2414;
    font-size: calc(var(--s) * 4.6px); line-height: 1.28;
    padding: calc(var(--s) * 2px) calc(var(--s) * 2.5px) calc(var(--s) * 2.2px);
    box-shadow: 0 0 0 calc(var(--s) * 1px) var(--madera), calc(var(--s) * 2px) calc(var(--s) * 2px) 0 calc(var(--s) * 1px) rgba(0,0,0,.22);
    transition: transform .4s ease;
  }
  .cartel::before { /* tira de color del modo */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--s) * 1px); background: var(--modo, #6a994e);
  }
  .cartel .cab { display: flex; align-items: center; gap: calc(var(--s) * 1.5px); font-weight: bold; color: #6b4630; }
  .cartel .cab .pto { width: calc(var(--s) * 3px); height: calc(var(--s) * 3px); flex: none; box-shadow: 0 0 0 1px #3b2414; }
  .cartel .cab .repo { margin-left: auto; font-weight: normal; background: #f1dfbf; padding: 0 calc(var(--s) * 1px); }
  .cartel .tk { font-weight: bold; margin-top: calc(var(--s) * 1px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cartel .tk b { color: #b5473a; }
  .cartel .nom {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.56em; color: #5a3a22;
  }
  .barra {
    height: calc(var(--s) * 4px); margin: calc(var(--s) * 1.5px) 0 calc(var(--s) * 1px);
    background: #e7d3ae; box-shadow: inset 0 0 0 1px #8a5a3b; position: relative; overflow: hidden;
  }
  .barra i {
    position: absolute; left: 1px; top: 1px; bottom: 1px; display: block; transition: width 1.2s steps(12);
    background: repeating-linear-gradient(90deg, var(--modo) 0 calc(var(--s) * 3px), transparent calc(var(--s) * 3px) calc(var(--s) * 4px));
  }
  .cartel .fila { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
  .cartel .pct { font-weight: bold; color: #3b2414; }
  .cartel .falta { color: #8a5a3b; }
  .mas { color: #2d6a4f; font-weight: bold; }
  .menos { color: #b5473a; font-weight: bold; }
  .cartel .fase { margin-top: calc(var(--s) * 1px); font-weight: bold; color: var(--modo); filter: brightness(.8); }
  .cartel.bloqueado { animation: menear 2.4s ease-in-out infinite; }
  .cartel.done { background: #e6f4dc; }
  @keyframes menear { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.2deg); } 75% { transform: rotate(1.2deg); } }
  .cartel .vacio { color: #8a5a3b; margin: calc(var(--s) * 2px) 0; }

  .globo {
    position: absolute; background: #fff; color: #2b1a10; font-size: calc(var(--s) * 4px); line-height: 1.2; white-space: nowrap;
    padding: calc(var(--s) * 1px) calc(var(--s) * 2px); box-shadow: 0 0 0 calc(var(--s) * 1px) #2b1a10;
    opacity: 0; transform: translateY(3px); transition: opacity .3s, transform .3s; pointer-events: none;
  }
  .globo.ver { opacity: 1; transform: none; }
  .globo::after { content: ""; position: absolute; left: calc(var(--s) * 4px); bottom: calc(var(--s) * -3px);
    border: calc(var(--s) * 1.5px) solid transparent; border-top-color: #2b1a10; }
  .globo.prueba { background: #fff6d6; }
  .rojo {
    position: absolute; display: none; text-align: center; color: #fff; background: #d62839; font-weight: bold;
    font-size: calc(var(--s) * 3.6px); line-height: 1.2; padding: calc(var(--s) * 0.8px) calc(var(--s) * 1px);
    box-shadow: 0 0 0 calc(var(--s) * 0.7px) #6a0f19; animation: menear 2.4s ease-in-out infinite;
  }
  .rojo.ver { display: block; }
  .cartel .meta { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; color: #8a5a3b; }
  .cartel .meta .vta.alta { color: #d62839; font-weight: bold; }
  .cartel .meta .esc { color: #b5473a; font-weight: bold; }
  .cartel .meta .sync.atras { color: #b07a1e; }
  .cartel .meta .sync.conf { color: #d62839; font-weight: bold; }
  .globo.pregunta { background: #ffe9a8; }
  .cartel .act { color: #8a5a3b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cartel .act.dormido { color: #d62839; font-weight: bold; }
  #burbuja {
    position: absolute; left: calc(var(--s) * 86px); top: calc(var(--s) * 116px); max-width: calc(var(--s) * 70px);
    background: #fff; color: #2b1a10; font-size: calc(var(--s) * 4.4px); line-height: 1.25;
    padding: calc(var(--s) * 1.5px) calc(var(--s) * 2.5px); box-shadow: 0 0 0 calc(var(--s) * 1px) #2b1a10;
    opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s; pointer-events: none;
  }
  #burbuja.ver { opacity: 1; transform: none; }
  #burbuja::after { content: ""; position: absolute; left: calc(var(--s) * -3px); top: calc(var(--s) * 4px);
    border: calc(var(--s) * 2px) solid transparent; border-right-color: #2b1a10; }

  #ticker {
    overflow: hidden; white-space: nowrap; background: #2b1a10; color: #f4d6a0;
    font-size: calc(var(--s) * 5px); padding: calc(var(--s) * 2px) 0; box-shadow: 0 0 0 3px #6b4630;
  }
  #ticker span { display: inline-block; padding-left: 15%; animation: correr 60s linear infinite; }
  @keyframes correr { to { transform: translateX(-100%); } }
  #aviso { color: #ffb703; }
  #hud .chip.az { color: #95d5b2; }
  #hud .chip.az.mal { color: #ffb703; box-shadow: inset 0 0 0 2px #d62839; animation: pulso 1.2s steps(2) infinite; }
  .cerrado { display: flex; gap: 3px; white-space: nowrap; overflow: hidden; }
  .cerrado b { color: #2d6a4f; flex: none; }
  .cerrado span { overflow: hidden; text-overflow: ellipsis; color: #5a3a22; }
  .sinconex { color: #b5473a; font-weight: bold; }

  /* carga del PC, develop y control */
  #hud .chip.carga { display: inline-flex; align-items: center; gap: calc(var(--s) * 2px); }
  .medidor { display: inline-block; width: calc(var(--s) * 26px); height: calc(var(--s) * 4px); background: #1a100a;
    box-shadow: inset 0 0 0 1px #6b4630; position: relative; overflow: hidden; }
  .medidor i { position: absolute; left: 1px; top: 1px; bottom: 1px; display: block; background: #95d5b2; transition: width .8s steps(8); }
  .medidor.cpu i { background: #79c0ff; }
  #hud .chip.carga.alta { box-shadow: inset 0 0 0 2px #d62839; animation: pulso 1.2s steps(2) infinite; }
  #hud .chip.carga.alta .medidor i { background: #ff7b72; }
  #hud .chip.dev { color: #c9b08a; }
  #hud .chip.dev.ok { color: #95d5b2; }
  #hud .chip.dev.rojo { color: #fff; background: #8f1d27; box-shadow: inset 0 0 0 2px #ff7b72; }
  #lista-control { width: calc(var(--s) * 150px); left: auto; right: 0; }
  #lista-control button, .modal button {
    font: inherit; cursor: pointer; border: 0; padding: calc(var(--s) * 1.5px) calc(var(--s) * 3px); margin: calc(var(--s) * 1px) 0;
    background: #6b4630; color: #fff3da; box-shadow: 0 calc(var(--s) * 1px) 0 #3b2414; text-align: left; width: 100%;
  }
  #lista-control button:hover, .modal button:hover { background: #8a5a3b; }
  #lista-control button:disabled { opacity: .45; cursor: not-allowed; }
  #lista-control .nota, .modal .nota { color: #8a5a3b; font-size: .9em; margin: calc(var(--s) * 1px) 0; }

  /* ventanas (modales) y línea de tiempo */
  .velo { position: fixed; inset: 0; background: rgba(20, 10, 5, .55); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal {
    background: var(--crema); color: #3b2414; width: min(92vw, calc(var(--s) * 260px)); max-height: 86vh; overflow: auto;
    font-size: calc(var(--s) * 5.2px); line-height: 1.4; padding: calc(var(--s) * 4px) calc(var(--s) * 6px);
    box-shadow: 0 0 0 4px #5a3a22, 10px 10px 0 4px rgba(0,0,0,.4);
  }
  .modal h2 { margin: 0 0 calc(var(--s) * 2px); font-size: 1.25em; color: #6b4630; }
  .modal table { width: 100%; border-collapse: collapse; margin: calc(var(--s) * 2px) 0; }
  .modal th, .modal td { text-align: left; padding: 2px 4px; border-bottom: 1px dashed #e0c9a0; white-space: nowrap; }
  .modal td.motivo { white-space: normal; color: #8a5a3b; }
  .modal .botones { display: flex; gap: calc(var(--s) * 3px); justify-content: flex-end; margin-top: calc(var(--s) * 3px); }
  .modal .botones button { width: auto; text-align: center; }
  .modal .botones button.peligro { background: #b5473a; }
  .modal .botones button.secundario { background: #c9b08a; color: #3b2414; }
  .modal .frase { display: flex; gap: 6px; align-items: center; background: #fff; padding: 4px 6px; box-shadow: inset 0 0 0 2px #d4a64a; margin: 4px 0; }
  .modal .frase code { flex: 1; font-size: 1.1em; font-weight: bold; color: #2d6a4f; }
  .modal .frase button { width: auto; }
  .modal .coordinador { background: #fff6d6; padding: 4px 6px; box-shadow: inset 3px 0 0 #d4a64a; margin: 4px 0; }
  .linea { list-style: none; margin: calc(var(--s) * 2px) 0; padding: 0 0 0 calc(var(--s) * 6px); position: relative; }
  .linea::before { content: ""; position: absolute; left: calc(var(--s) * 2px); top: 4px; bottom: 4px; width: 2px; background: #d9c39a; }
  .linea li { position: relative; padding: 2px 0 4px; }
  .linea li::before { content: ""; position: absolute; left: calc(var(--s) * -5.5px); top: .45em; width: calc(var(--s) * 3px); height: calc(var(--s) * 3px);
    background: var(--c, #8a5a3b); box-shadow: 0 0 0 1px #3b2414; }
  .linea li time { color: #8a5a3b; margin-right: 6px; }
  .linea li .dur { float: right; color: #8a5a3b; font-size: .9em; }
  .linea li .det { display: block; color: #8a5a3b; font-size: .88em; }
  .modal a { color: #1f6feb; font-weight: bold; }
  #carteles .cartel { cursor: pointer; }
  #carteles .cartel:hover { filter: brightness(1.04); }

  /* etiqueta del colgado (bajo el escritorio) */
  .rojo small { display: block; font-weight: normal; opacity: .95; }
  .rojo { cursor: pointer; }
  .rojo[data-causa="persona"] { background: #c98a1a; box-shadow: 0 0 0 calc(var(--s) * .7px) #6b4a0a; }
  .rojo[data-causa="bloqueado"] { background: #7b4bb5; box-shadow: 0 0 0 calc(var(--s) * .7px) #3e2160; }
  .rojo[data-causa="pruebas-largas"] { background: #d8662a; box-shadow: 0 0 0 calc(var(--s) * .7px) #6e2c0d; }
</style>
</head>
<body>
  <header id="hud">
    <h1>☕ OFICINA DEL ORQUESTADOR</h1>
    <span class="contador">
      <button class="chip grande" data-lista="hoy" aria-expanded="false" title="Ver cuáles">✔ Done hoy: <b id="cerrados">–</b><i>▾</i></button>
      <div class="desplegable" id="lista-hoy"></div>
    </span>
    <span class="contador">
      <button class="chip grande" data-lista="semana" aria-expanded="false" title="Ver cuáles">📅 Semana: <b id="semana">–</b><i>▾</i></button>
      <div class="desplegable" id="lista-semana"></div>
    </span>
    <span class="chip">🧪 A QA hoy: <b id="aqa">–</b></span>
    <span class="chip az" id="az" title="">☁ Azure</span>
    <span class="chip">⌨ Trabajando: <b id="trab">–</b></span>
    <span class="chip">🌊 Ola <b id="ola">–</b></span>
    <span class="chip carga" id="carga" title="Carga del PC">🖥 <span class="medidor" title="RAM en uso"><i id="carga-ram" style="width:0"></i></span><span class="medidor cpu" title="CPU en uso"><i id="carga-cpu" style="width:0"></i></span><b id="carga-txt">–</b></span>
    <span class="chip dev" id="develop" title="">⎇ develop …</span>
    <span class="contador">
      <button class="chip" data-lista="control" aria-expanded="false" title="Procesos, pausa y avisos">🎛 Control<i>▾</i></button>
      <div class="desplegable" id="lista-control"></div>
    </span>
    <span id="aviso"></span>
    <span class="der"><span id="quien"></span><span id="vivo"></span>Actualizado <b id="hora">--:--:--</b></span>
  </header>
  <main id="escena">
    <canvas id="c" width="640" height="270"></canvas>
    <div id="carteles"></div>
    <div id="burbuja"></div>
  </main>
  <footer id="ticker"><span id="eventos">Cargando la oficina…</span></footer>

<script>
'use strict';
/* =========================================================== escala */
const W = 640, H = 270;
// Enganches para panel.js y mascotas.js: dibujar en el suelo, sumar figuras ordenadas por profundidad, dibujar encima
// de todo, moverse y enterarse de cada refresco.
const ganchos = { suelo: [], dibujables: [], encima: [], mover: [], datos: [] };
function escalar() {
  const libreAlto = innerHeight - 110;
  let s = Math.min((innerWidth - 40) / W, libreAlto / H);
  if (s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.max(1, s);
  const raiz = document.documentElement.style;
  raiz.setProperty('--s', s);
  raiz.setProperty('--ancho', W * s + 'px');
  raiz.setProperty('--alto', H * s + 'px');
}
addEventListener('resize', escalar);
escalar();

/* =========================================================== utilidades de dibujo */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const bgx = bg.getContext('2d');
let X = ctx;
const R = (x, y, w, h, c) => { X.fillStyle = c; X.fillRect(Math.round(x), Math.round(y), w, h); };
function semilla(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function oscuro(hex, f = 0.75) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c(n >> 16)},${c(n >> 8 & 255)},${c(n & 255)})`;
}
function glifo(g, x, y, c) { for (let j = 0; j < g.length; j++) for (let i = 0; i < g[j].length; i++) if (g[j][i] === '1') R(x + i, y + j, 1, 1, c); }
const FUENTE = {
  J: ['011','001','001','101','010'], E: ['111','100','110','100','111'], F: ['111','100','110','100','100'],
  0: ['111','101','101','101','111'], 1: ['010','110','010','010','111'], 2: ['111','001','111','100','111'],
  3: ['111','001','011','001','111'], 4: ['101','101','111','001','001'], 5: ['111','100','111','001','111'],
  6: ['111','100','111','101','111'], 7: ['111','001','010','010','010'], 8: ['111','101','111','101','111'], 9: ['111','101','111','001','111'],
};
function texto(s, x, y, c) { [...s].forEach((ch, i) => FUENTE[ch] && glifo(FUENTE[ch], x + i * 4, y, c)); }
const PREGUNTA = ['01110','10001','00001','00010','00100','00000','00100'];
const CHECK = ['00000001','00000011','10000110','11001100','01111000','00110000'];
const ZETA = ['111','001','010','100','111'];
function circulo(cx, cy, r, c) { for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); R(cx - w, cy + y, w * 2 + 1, 1, c); } }
function linea(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, 1, 1, c); }

/* =========================================================== el mundo */
const ESCRITORIOS = [185, 255, 325, 395, 465];
const JEFE_X = 72;
const CAFE = [{ x: 516, y: 224 }, { x: 544, y: 224 }];
const SOFA = [{ x: 572 }, { x: 594 }, { x: 616 }];
const SOFA_Y = 206, PASILLO = 248, SILLA_Y = 232;
const ASPECTO = [
  { piel: '#f1c27d', pelo: '#3b2416', estilo: 'corto', camisa: '#e76f51', pantalon: '#3d3b5c' },
  { piel: '#c68642', pelo: '#1b1b1b', estilo: 'largo', camisa: '#2a9d8f', pantalon: '#4a3f35' },
  { piel: '#ffdbac', pelo: '#d9822b', estilo: 'mono', camisa: '#e9c46a', pantalon: '#2f4858' },
  { piel: '#8d5524', pelo: '#2a1a10', estilo: 'rizos', camisa: '#8e7dbe', pantalon: '#3b3b3b' },
  { piel: '#e0ac69', pelo: '#5b3a29', estilo: 'gorra', gorra: '#264653', camisa: '#f4a261', pantalon: '#3d405b' },
];
const COLOR_MODO = { trabajando: '#e07a32', revisando: '#8e6cc9', esperando: '#2a9d8f', bloqueado: '#d62839', libre: '#5f8f3e' };
const EN_ESCRITORIO = new Set(['trabajando', 'revisando', 'esperando', 'bloqueado']);
// En su escritorio: con el ticket en sus manos, o mirando correr las pruebas aunque ya esté aprobado.

/* ----------------------------------------------------------- cielo y ventanas */
function cielo() {
  const d = new Date(); const h = d.getHours() + d.getMinutes() / 60;
  if (h >= 6.5 && h < 17.3) return { fase: 'dia', bandas: ['#7cc6f2', '#93d2f5', '#addff8', '#c8eafb'] };
  if ((h >= 17.3 && h < 18.8) || (h >= 5.5 && h < 6.5)) return { fase: 'tarde', bandas: ['#5b5b9a', '#c86b7a', '#f39b6d', '#ffcf7a'] };
  return { fase: 'noche', bandas: ['#141b3d', '#1d2b53', '#2a3468', '#3b3f74'] };
}
function ventana(x, y, w, h, t, sem) {
  const c = cielo();
  const bh = Math.ceil(h / c.bandas.length);
  c.bandas.forEach((col, i) => R(x, y + i * bh, w, Math.min(bh, h - i * bh), col));
  X.save(); X.beginPath(); X.rect(x, y, w, h); X.clip();
  const rnd = semilla(sem);
  if (c.fase === 'noche') {
    for (let i = 0; i < 14; i++) { const sx = x + rnd() * w, sy = y + rnd() * h * 0.55; if ((Math.floor(t / 700) + i) % 5) R(sx, sy, 1, 1, '#fff6d5'); }
    circulo(x + w - 12, y + 9, 4, '#fdf0c2'); circulo(x + w - 10, y + 8, 3, c.bandas[0]);
  } else if (c.fase === 'dia') {
    circulo(x + 10, y + 9, 4, '#fff3b0');
    for (let k = 0; k < 2; k++) {
      const nx = x - 20 + ((t / (180 + k * 90) + k * 47 + sem * 13) % (w + 30));
      const ny = y + 7 + k * 9;
      R(nx, ny, 14, 3, '#fff'); R(nx + 3, ny - 2, 7, 2, '#fff'); R(nx + 1, ny + 3, 12, 1, '#e3f3fb');
    }
  } else {
    circulo(x + w / 2, y + h * 0.62, 6, '#ffde8a');
  }
  // cerros y edificios
  const monte = c.fase === 'noche' ? '#1b2a33' : c.fase === 'tarde' ? '#5a4a6a' : '#4f8a5f';
  for (let i = 0; i < w; i++) { const mh = 14 + Math.sin((i + sem * 9) / 9) * 5 + Math.sin((i + sem) / 4) * 2; R(x + i, y + h - mh, 1, mh, monte); }
  const edif = c.fase === 'noche' ? '#262046' : c.fase === 'tarde' ? '#6b5068' : '#8b7f9e';
  for (let bx = x; bx < x + w; ) {
    const bw = 5 + Math.floor(rnd() * 7), bhh = 6 + Math.floor(rnd() * 14);
    R(bx, y + h - bhh, bw - 1, bhh, edif);
    if (c.fase !== 'dia') for (let wy = y + h - bhh + 2; wy < y + h - 1; wy += 3) for (let wx = bx + 1; wx < bx + bw - 2; wx += 2) if (rnd() > 0.55) R(wx, wy, 1, 1, '#ffd166');
    bx += bw;
  }
  X.restore();
  R(x - 2, y - 2, w + 4, 2, '#6b4630'); R(x - 2, y + h, w + 4, 2, '#6b4630'); R(x - 2, y, 2, h, '#6b4630'); R(x + w, y, 2, h, '#6b4630');
  R(x + w / 2 - 1, y, 2, h, '#6b4630'); R(x, y + h / 2 - 1, w, 2, '#6b4630');
  R(x - 4, y + h + 2, w + 8, 3, '#8a5a3b'); R(x - 4, y + h + 2, w + 8, 1, '#a8744c');
  R(x + 3, y + 3, 1, 6, 'rgba(255,255,255,.35)'); R(x + 5, y + 3, 1, 3, 'rgba(255,255,255,.25)');
  return c;
}
function reloj(cx, cy) {
  circulo(cx, cy, 9, '#6b4630'); circulo(cx, cy, 8, '#fff7e6');
  for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; R(cx + Math.round(Math.sin(a) * 7), cy - Math.round(Math.cos(a) * 7), 1, 1, k % 3 ? '#c9a77a' : '#5a3a22'); }
  const d = new Date();
  const am = (d.getMinutes() + d.getSeconds() / 60) / 60 * Math.PI * 2;
  const ah = ((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2;
  const as = d.getSeconds() / 60 * Math.PI * 2;
  linea(cx, cy, cx + Math.round(Math.sin(ah) * 4), cy - Math.round(Math.cos(ah) * 4), '#3b2414');
  linea(cx, cy, cx + Math.round(Math.sin(am) * 6), cy - Math.round(Math.cos(am) * 6), '#3b2414');
  linea(cx, cy, cx + Math.round(Math.sin(as) * 6), cy - Math.round(Math.cos(as) * 6), '#d62839');
  R(cx, cy, 1, 1, '#d62839');
}
function vapor(x, y, t, fase = 0) {
  for (let k = 0; k < 3; k++) {
    const p = ((t / 900 + k / 3 + fase) % 1);
    const yy = y - p * 9; const xx = x + Math.round(Math.sin(p * 6 + k) * 1.5);
    R(xx, yy, 1, 1, `rgba(255,255,255,${0.75 * (1 - p)})`);
  }
}

/* ----------------------------------------------------------- pantallas */
const PALETA_CODIGO = ['#7ee787', '#ffd866', '#ff9e64', '#79c0ff', '#d2a8ff', '#c9d1d9'];
const pantallas = ESCRITORIOS.map((_, i) => ({ lineas: [], prox: 0, rnd: semilla(100 + i) }));
function pantalla(i, cx, modo, t, tecleando) {
  const sx = cx - 13, sy = 142, sw = 26, sh = 18;
  const p = pantallas[i];
  if (modo === 'apagada') {
    R(sx, sy, sw, sh, '#0b1220');
    const per = (v, m) => { const k = v % (2 * m); return k < m ? k : 2 * m - k; };
    const bx = per(Math.floor(t / 160 + i * 7), sw - 7), by = per(Math.floor(t / 210 + i * 3), sh - 5);
    const col = PALETA_CODIGO[Math.floor(t / 2500 + i) % PALETA_CODIGO.length];
    R(sx + bx, sy + by, 7, 5, col); R(sx + bx + 1, sy + by + 1, 5, 3, '#0b1220'); R(sx + bx + 2, sy + by + 2, 3, 1, col);
  } else if (modo === 'codigo') {
    R(sx, sy, sw, sh, '#13202b');
    if (tecleando && t > p.prox) {
      p.prox = t + 140 + p.rnd() * 260;
      const ult = p.lineas.at(-1);
      if (ult && ult.w < ult.max) ult.w += 2;
      else {
        const ind = p.rnd() < 0.3 ? 0 : (Math.floor(p.rnd() * 3) * 2);
        p.lineas.push({ ind, w: 1, max: 3 + Math.floor(p.rnd() * (16 - ind)), c: PALETA_CODIGO[Math.floor(p.rnd() * PALETA_CODIGO.length)] });
        if (p.lineas.length > 6) p.lineas.shift();
      }
    }
    p.lineas.forEach((l, k) => R(sx + 2 + l.ind, sy + 1 + k * 3, l.w, 2, l.c));
    const ult = p.lineas.at(-1);
    if (Math.floor(t / 400) % 2) R(sx + 3 + (ult ? ult.ind + ult.w : 0), sy + 1 + Math.max(0, p.lineas.length - 1) * 3, 1, 2, '#fff');
    R(sx, sy + sh - 2, sw, 2, '#1f6feb');
  } else if (modo === 'diff') {
    R(sx, sy, sw, sh, '#191629');
    const off = Math.floor(t / 600);
    for (let k = 0; k < 6; k++) {
      const tipo = (k + off) % 4; const col = tipo === 0 ? '#f85149' : tipo === 1 ? '#c9d1d9' : '#3fb950';
      R(sx + 1, sy + 1 + k * 3, sw - 2, 2, tipo === 0 ? 'rgba(248,81,73,.18)' : tipo === 1 ? 'transparent' : 'rgba(63,185,80,.18)');
      R(sx + 2, sy + 1 + k * 3, 1, 2, col);
      R(sx + 5, sy + 1 + k * 3, 4 + ((k * 7 + off * 3) % 14), 2, col);
    }
    const ly = sy + (Math.floor(t / 80) % sh); R(sx, ly, sw, 1, 'rgba(210,168,255,.55)');
    circulo(sx + sw - 6, sy + 6, 3, '#d2a8ff'); circulo(sx + sw - 6, sy + 6, 2, '#191629'); R(sx + sw - 4, sy + 8, 2, 2, '#d2a8ff');
  } else if (modo === 'ok') {
    R(sx, sy, sw, sh, '#0e2a20');
    if (Math.floor(t / 700) % 4) glifo(CHECK, sx + 9, sy + 6, '#7ee787');
    R(sx + 3, sy + sh - 3, sw - 6, 1, '#2d6a4f');
  } else if (modo === 'pruebas') {
    R(sx, sy, sw, sh, '#0f1d17');
    const n = Math.floor(t / 140 + i * 11) % 66;
    for (let k = 0; k < Math.min(n, 60); k++) R(sx + 2 + (k % 12) * 2, sy + 2 + Math.floor(k / 12) * 3, 1, 2, k % 17 === 9 ? '#ffb703' : '#3fb950');
    R(sx + 2, sy + sh - 3, Math.round((sw - 4) * Math.min(n, 60) / 60), 1, '#7ee787');
  } else if (modo === 'duda') {
    R(sx, sy, sw, sh, '#2a1a0e');
    if (Math.floor(t / 500) % 2) glifo(PREGUNTA, sx + 10, sy + 5, '#ffb703');
  }
  for (let y = sy + 1; y < sy + sh; y += 2) R(sx, y, sw, 1, 'rgba(0,0,0,.16)');
  R(sx + 1, sy + 1, 4, 1, 'rgba(255,255,255,.22)');
  if (modo !== 'apagada' && Math.random() < 0.02) R(sx, sy, sw, sh, 'rgba(255,255,255,.22)');
}

  jefeEl.innerHTML = `<div class="cab"><span class="pto" style="background:#3d405b"></span>★ JEFE ORQUESTADOR<span class="repo">ola ${esc(estado?.ola ?? '–')}</span></div>` +
    `<div class="grandes"><div><b>${estado?.cerradosHoy ?? 0}</b>Done hoy</div><div><b>${cer.semana ?? '–'}</b>semana</div>` +
    `<div><b>${trab}/${agentes.filter((a) => a.dato).length}</b>trabajando</div></div>` +
    (cer.ok === false ? `<div class="sinconex">⚠ Azure sin conexión${cer.at ? ' · dato de las ' + hora(cer.at) : ''}</div>` : '');
  const sala = cartel('cartel-sala', 506, 128);
  sala.style.setProperty('--modo', '#6b4630');
  const libres = agentes.filter((a) => a.dato && !alEscritorio(a.dato));
  sala.innerHTML = `<div class="cab">☕ SALA DEL TINTO</div><div style="margin-top:3px">${libres.length ? libres.map((a) => `<span style="color:${oscuro(a.aspecto.camisa, .8)};font-weight:bold">■</span> ${esc(a.dato.nombre)}${a.dato.done ? ' ✔' : a.dato.ticket ? ` <span class="falta">#${a.dato.ticket} ${a.dato.pct}%</span>` : ''}`).join('<br>') : 'Vacía: todos están trabajando 💪'}</div>`;
}

/* =========================================================== burbuja del jefe */
const burbuja = document.getElementById('burbuja');
let burbujaViva = false, frase = 0;
function frasesDelJefe() {
  const f = [];
  if (!estado) return ['Cargando…'];
  const ag = estado.agentes ?? [];
  for (const a of ag.filter((x) => x.atascado)) f.push(`#${a.ticket} lleva ${duracion(a.inactivoMin ?? 0)} quieto. ¿Se durmió? 😴`);
  for (const a of ag.filter((x) => x.pruebas)) f.push(`Corriendo pruebas en #${a.ticket}… crucemos los dedos 🤞`);
  for (const a of ag.filter((x) => x.modo === 'bloqueado')) f.push(`#${a.ticket}: ${a.fase.toLowerCase()}${a.pregunta ? ' — «' + a.pregunta.slice(0, 90) + '»' : ''}. Ya lo miro.`);
  for (const a of ag.filter((x) => x.modo === 'revisando')) f.push(`A ver esa revisión de #${a.ticket}…`);
  for (const a of ag.filter((x) => x.modo === 'esperando')) f.push(`#${a.ticket} está LISTO. ¡Que pase el reviewer!`);
  for (const a of ag.filter((x) => x.pct >= 75 && !x.done)) f.push(`#${a.ticket} aprobado. Tintico merecido ☕`);
  for (const a of ag.filter((x) => x.done)) f.push(`¡#${a.ticket} en Done! 🎉`);
  const trab = ag.filter((x) => x.modo === 'trabajando');
  if (trab.length) f.push(`${trab.length} teclando. Así me gusta.`);
  const lineas = ag.reduce((s, x) => s + (x.mas || 0), 0);
  if (lineas) f.push(`+${fmt(lineas)} líneas en la ola. ¡Juemadre!`);
  f.push(estado.cerradosHoy ? `Van ${estado.cerradosHoy} cerrados hoy 🏆` : 'Hoy cerramos algo, ¿o qué?');
  return f;
}
function hablar() {
  const f = frasesDelJefe();
  burbuja.textContent = f[frase++ % f.length];
  burbuja.classList.add('ver'); burbujaViva = true;
  setTimeout(() => { burbuja.classList.remove('ver'); burbujaViva = false; }, 5200);
}
setInterval(hablar, 9000);
setTimeout(hablar, 1500);

/* =========================================================== listas de cerrados (se abren con el botón) */
const corto = (t) => { const p = String(t).split('·').map((x) => x.trim()); return p.length > 1 ? `${p[0]} ${p.at(-1)}` : t; };
function pintarListas(cer) {
  const aviso = cer.ok === false
    ? `<div class="sinconex">⚠ Azure sin conexión${cer.at ? ' · dato de las ' + hora(cer.at) : ''}</div>`
    : cer.fuente !== 'azure' ? '<div class="falta">Consultando Azure…</div>' : '';
  const filas = (lista, conDia) => (lista ?? []).length
    ? lista.map((u) => `<div class="cerrado"><b>✔ #${u.id}</b><span title="${esc(u.titulo)}">${esc(corto(u.titulo))}</span><time>${u.at ? (conDia ? new Date(u.at).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric' }) + ' ' : '') + hora(u.at, true) : ''}</time></div>`).join('')
    : (cer.fuente === 'azure' ? '<div class="falta">Ninguno todavía</div>' : '');
  document.getElementById('lista-hoy').innerHTML = `<h3>✔ Done hoy: ${cer.hoy ?? 0}</h3>` + aviso + filas(cer.listaHoy, false);
  document.getElementById('lista-semana').innerHTML = `<h3>📅 Done en los últimos 7 días: ${cer.semana ?? 0}</h3>` + aviso + filas(cer.listaSemana, true);
}
function cerrarListas() {
  document.querySelectorAll('.contador').forEach((c) => { c.classList.remove('abierto'); c.querySelector('button').setAttribute('aria-expanded', 'false'); });
}
document.querySelectorAll('#hud button[data-lista]').forEach((b) => b.addEventListener('click', (ev) => {
  ev.stopPropagation();
  const c = b.parentElement;
  const abrir = !c.classList.contains('abierto');
  cerrarListas();
  c.classList.toggle('abierto', abrir);
  b.setAttribute('aria-expanded', String(abrir));
}));
document.addEventListener('click', (ev) => { if (!ev.target.closest('.contador')) cerrarListas(); });
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarListas(); });
// #hoy o #semana en la URL abre esa lista al cargar (sirve para dejarla fija en una pestaña).
const listaInicial = document.querySelector(`#hud button[data-lista="${location.hash.slice(1)}"]`);
if (listaInicial) { listaInicial.parentElement.classList.add('abierto'); listaInicial.setAttribute('aria-expanded', 'true'); }

/* =========================================================== datos */
const hora = (iso, corta) => new Date(iso).toLocaleTimeString('es-CO', { hour12: false, hour: '2-digit', minute: '2-digit', ...(corta ? {} : { second: '2-digit' }) });
const vivo = document.getElementById('vivo');
async function traer() {
  try {
    const r = await fetch('/estado.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    estado = await r.json();
    agentes.forEach((a, i) => { a.dato = estado.agentes?.[i] ?? null; });
    repartir();
    agentes.forEach((a, i) => revisorA(i, a.dato?.modo === 'revisando' && !a.dato.atascado));
    const primera = primeraCarga;
    primeraCarga = false;
    pintarCarteles();
    for (const g of ganchos.datos) {
      try { g(estado, primera); } catch (e) { console.error(e); }
    }
    document.getElementById('cerrados').textContent = estado.cerradosHoy ?? 0;
    document.getElementById('aqa').textContent = estado.enQaHoy ?? 0;
    const cer = estado.cerrados ?? {};
    document.getElementById('semana').textContent = cer.semana ?? '–';
    pintarListas(cer);
    document.getElementById('quien').textContent = estado.persona ? `👤 ${estado.persona}${estado.marca ? ' · ' + estado.marca : ''}` : estado.marca ?? '';
    document.title = `Oficina${estado.persona ? ' de ' + estado.persona : ''} · Done hoy ${estado.cerradosHoy ?? 0}`;
    const az = document.getElementById('az');
    az.className = 'chip az' + (cer.ok === false ? ' mal' : '');
    az.textContent = cer.ok === false ? '⚠ Azure sin conexión' : cer.ok ? `☁ Azure ${hora(cer.at, true)}` : '☁ Azure…';
    az.title = cer.ok === false ? `${cer.error ?? ''}${cer.at ? ' · último dato bueno: ' + hora(cer.at) : ''}` : 'Cerrados de Azure, se consultan cada 5 min';
    document.getElementById('trab').textContent = `${estado.trabajando ?? 0}/${agentes.filter((a) => a.dato).length}`;
    document.getElementById('ola').textContent = estado.ola ?? '–';
    document.getElementById('hora').textContent = estado.actualizado ? new Date(estado.actualizado).toLocaleTimeString('es-CO', { hour12: false }) : '--:--:--';
    document.getElementById('aviso').textContent = estado.aviso ?? '';
    document.getElementById('eventos').textContent = (estado.recientes ?? []).join('   ◆   ') || 'Sin eventos todavía';
    vivo.className = 'pulso';
  } catch {
    vivo.className = 'mal';
    document.getElementById('aviso').textContent = 'Sin conexión con oficina/server.mjs';
  }
}
traer();
setInterval(traer, 10000);

/* =========================================================== bucle */
function halo(x, y, r, c) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
pintarFondo();
const bgSinTaza = document.createElement('canvas'); bgSinTaza.width = W; bgSinTaza.height = H;
pintarFondo(bgSinTaza.getContext('2d'), false);
let antes = 0, ultimoCuadro = 0;
function cuadro(t) {
  requestAnimationFrame(cuadro);
  if (t - ultimoCuadro < 60) return;
  const dt = Math.min(0.2, (t - (antes || t)) / 1000); antes = t; ultimoCuadro = t;
  mover(dt);
  X = ctx;
  ctx.drawImage(bg, 0, 0);
  const c = ventana(22, 78, 92, 40, t, 3);
  ventana(568, 66, 62, 46, t, 11);
  reloj(536, 94);
  vapor(519, 134, t); vapor(521, 133, t, 0.5);
  R(513, 123, 5, 3, Math.floor(t / 800) % 2 ? '#7ee787' : '#3fb950');
  R(514, 135, 10, 10, 'rgba(200,230,255,.45)'); R(515, 139, 8, 6, '#4a2a17'); R(514, 135, 10, 1, '#dfe9ef');
  for (const g of ganchos.suelo) g(t);
  jefe(t);
  agentes.forEach((a, i) => {
    const cx = ESCRITORIOS[i];
    const sentado = a.pose === 'escritorio' && alEscritorio(a.dato);
    const modo = a.dato?.atascado ? 'dormido' : a.dato?.pruebas ? 'pruebas' : a.dato?.modo;
    const pant = !sentado || modo === 'dormido' ? 'apagada' : modo === 'pruebas' ? 'pruebas' : modo === 'revisando' ? 'diff' : modo === 'esperando' ? 'ok' : modo === 'bloqueado' ? 'duda' : 'codigo';
    const tecleando = sentado && modo === 'trabajando' && (t / 1000 + a.n * 3.1) % 9 >= 1.1;
    pantalla(i, cx, pant, t, tecleando);
    if (sentado) deEspaldas(cx, a.aspecto, modo, t, a.n);
    else { silla(cx); texto(String(a.n), cx - 1, 186, '#62627e'); }
  });
  const enSofa = agentes.filter((a) => a.pose === 'sofa');
  for (const a of enSofa) deFrente(SOFA[a.destino.k].x, SOFA_Y, a.aspecto, 'sofa', t, a.n, a.n % 2 ? 'dormir' : 'celular');
  const dePie = [
    ...agentes.filter((a) => a.pose === 'cafe' || a.pose === 'camina')
      .map((a) => ({ y: a.y, pintar: () => deFrente(a.x, a.y, a.aspecto, a.pose, t, a.n, a.pose === 'cafe' ? 'tinto' : null) })),
    ...revisores.map((r, i) => ({ r, i })).filter(({ r }) => r.estado !== 'fuera')
      .map(({ r, i }) => ({ y: r.y, pintar: () => deFrente(r.x, r.y, REVISOR, r.estado === 'ahi' ? 'pie' : 'camina', t, 7 + i, r.estado === 'ahi' ? 'lupa' : null) })),
    ...ganchos.dibujables.flatMap((g) => g(t)),
  ].sort((p, q) => p.y - q.y);
  for (const p of dePie) p.pintar();
  revisores.forEach((r, i) => document.getElementById('globo-rev-' + i)?.classList.toggle('ver', r.estado === 'ahi' && Math.floor(t / 4000 + i) % 3 !== 2));
  // luz de la noche
  if (c.fase !== 'dia') {
    ctx.fillStyle = c.fase === 'noche' ? 'rgba(25,15,55,.22)' : 'rgba(120,50,40,.10)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    agentes.forEach((a, i) => {
      if (a.pose === 'escritorio' && alEscritorio(a.dato) && !a.dato.atascado) halo(ESCRITORIOS[i], 152, 30, 'rgba(90,150,210,.16)');
    });
    halo(ESCRITORIOS[2] + 22, 162, 16, 'rgba(255,190,90,.18)');
    halo(519, 126, 14, 'rgba(255,120,110,.10)');
    ctx.globalCompositeOperation = 'source-over';
  }
  for (const g of ganchos.encima) g(t);
}
requestAnimationFrame(cuadro);
</script>
